services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    restart: unless-stopped

  qmission:
    build: ..
    command: ["-r", "http://qbittorrent:8080/"]
    environment:
      QBT_USER: ${QBT_USER}
      QBT_PASS: ${QBT_PASS}
      QMISSION_USER: ${QMISSION_USER}
      QMISSION_PASS: ${QMISSION_PASS}
    ports:
      - "9091:9091"
    restart: unless-stopped
