services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    ports: ["8080:8080", "6881:6881", "6881:6881/udp"]
    volumes: ["./config:/config", "./downloads:/downloads"]
    restart: unless-stopped

  qmission:
    build: ..
    command: ["-r", "http://qbittorrent:8080/"]
    env_file: .env
    ports: ["9091:9091"]
    restart: unless-stopped
