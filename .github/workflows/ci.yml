name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # TODO: widen to ./... once the bare bencode struct tags in
      # cmd/qmission/metainfo.go are fixed (stage 1b).
      - name: Vet
        run: go vet ./qBT ./transmission

      - name: Test
        run: go test -race ./...

  docker:
    name: Docker image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go build cross-compiles natively; QEMU is only for the runtime stage's `apk add`.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Build only: no registry decided yet.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: qmission:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
